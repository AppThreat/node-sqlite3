blockExoticSubdeps: true
lockfileIncludeTarballUrl: true
minimumReleaseAge: '4320' # 3 days, in hours — supply-chain control
minimumReleaseAgeExclude:
  - '@appthreat/*'
optimisticRepeatInstall: true
preferSymlinkedExecutables: false
strictDepBuilds: true
# Enforce trust-evidence downgrades across the whole tree. The temporary
# trustPolicyIgnoreAfter window that D15 added for mocha's chokidar went
# away with mocha in Deliverable 12.
trustPolicy: no-downgrade

# pnpm 11 no longer reads the `pnpm` field in package.json; overrides and
# built-dependency policy live here instead, even in a single-package repo.
#
# onlyBuiltDependencies is intentionally empty: no dependency in this tree
# needs lifecycle scripts. @biomejs/biome (Deliverable 12) ships its
# platform binaries as plain optionalDependencies with no install script,
# so it needs no entry here. strictDepBuilds fails the install and names
# anything blocked, so a needed entry cannot be missed silently.
