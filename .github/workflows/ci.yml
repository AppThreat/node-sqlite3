name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'release/*'
    tags:
      - '*'
env:
  FORCE_COLOR: 1
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Lint needs no native build: biome ships as optionalDependencies and
  # its bin resolves without lifecycle scripts, so --ignore-scripts is
  # safe here. lint:jsdoc hard-fails on any undocumented shipped
  # declaration (Deliverable 04).
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (check only; CI never runs --write)
        run: pnpm run lint:check
      - name: JSDoc completeness (hard fail)
        run: pnpm run lint:jsdoc

  # Type declarations: tsd assertions plus a strict/node16 consumer
  # compile, then a regeneration diff proving the committed .d.ts files
  # match the JSDoc and the hand-written declarations. No native build
  # is involved — gen-types only typechecks lib/*.js.
  types:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type tests (tsd + strict/node16 consumer)
        run: pnpm run test:types
      - name: Regenerated declarations must match the committed ones
        run: |
          pnpm run gen-types
          git diff --exit-code -- lib/sqlite3.d.ts lib/promises.d.ts lib/trace.d.ts


  # Fast test feedback via a dev rebuild instead of a full prebuild.
  # Leak check: the suite must exit on its own — nothing here passes
  # --force-exit, so a leaked handle or worker hangs the run and the
  # job times out (a failure, not a silent pass). The stray-.only guard
  # runs inside `pnpm run test` and fails rather than silently skipping.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    name: test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild native module (required after --ignore-scripts)
        run: pnpm run rebuild
      - name: Run tests
        run: pnpm run test

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-latest
        host:
          - x64
        target:
          - x64
        node:
          - 24
        include:
          - os: macos-latest
            node: 24
            host: arm64
            target: arm64
          - os: ubuntu-22.04-arm
            node: 24
            host: arm64
            target: arm64
          - os: windows-11-arm
            node: 24
            host: arm64
            target: arm64

    name: ${{ matrix.os }} (host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # Reads the version from the packageManager field in package.json.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.host }}
          scope: '@appthreat'
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ matrix.host }}-
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.12
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        if: contains(matrix.os, 'windows')
        with:
          msbuild-architecture: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Node compatibility
        run: node tools/semver-check.js

      - name: Add env vars
        shell: bash
        run: |
          echo "V=1" >> $GITHUB_ENV

          if [ "${{ matrix.target }}" = "x86" ]; then
            echo "TARGET=ia32" >> $GITHUB_ENV
          else
            echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          fi

      - name: Add Linux env vars
        if: contains(matrix.os, 'ubuntu')
        run: |
          echo "CFLAGS=${CFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV
          echo "CXXFLAGS=${CXXFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV

      - name: Build binaries
        run: pnpm run prebuild --arch ${{ env.TARGET }} --tag-libc

      - name: Print binary info
        if: contains(matrix.os, 'ubuntu')
        run: |
          ldd prebuilds/*/*.node
          echo "---"
          nm prebuilds/*/*.node | grep "GLIBC_" | c++filt || true
          echo "---"
          file prebuilds/*/*.node

      - name: Run tests
        run: pnpm run test

      - name: Upload prebuilds to artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.host }}-${{ matrix.target }}-${{ matrix.node }}
          path: prebuilds/

  build-qemu:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
        target:
          - linux/arm64
        variant:
          - alpine3.20
        include:
          # musl x64 builds
          - target: linux/amd64
            variant: alpine3.20
            node: 24
    name: ${{ matrix.variant }} (node=${{ matrix.node }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build binaries and test
        run: |
          docker buildx build \
            --file ./tools/BinaryBuilder.Dockerfile \
            --load \
            --tag sqlite-builder \
            --platform ${{ matrix.target }} \
            --no-cache \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder)
          docker cp $CONTAINER_ID:/usr/src/build/prebuilds/ ./prebuilds
      - name: Sanitize target name for Artifact
        run: |
          SAFE_TARGET=$(echo "${{ matrix.target }}" | tr '/' '-')
          echo "SAFE_TARGET=$SAFE_TARGET" >> $GITHUB_ENV
      - name: Upload QEMU prebuilds to artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: prebuilds-qemu-${{ matrix.variant }}-${{ env.SAFE_TARGET }}-${{ matrix.node }}
          path: prebuilds/

  publish:
    needs: [build, build-qemu]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          scope: '@appthreat'

      - name: Download and merge all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # Reads the version from the packageManager field in package.json.

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm publish --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access=public
        if: startsWith(github.ref, 'refs/tags/')
