name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'release/*'
    tags:
      - '*'
env:
  FORCE_COLOR: 1
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Lint needs no native build: biome ships as optionalDependencies and
  # its bin resolves without lifecycle scripts, so --ignore-scripts is
  # safe here. lint:jsdoc hard-fails on any undocumented shipped
  # declaration (Deliverable 04).
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (check only; CI never runs --write)
        run: pnpm run lint:check
      - name: JSDoc completeness (hard fail)
        run: pnpm run lint:jsdoc

  # Type declarations: tsd assertions plus a strict/node16 consumer
  # compile, then a regeneration diff proving the committed .d.ts files
  # match the JSDoc and the hand-written declarations. No native build
  # is involved — gen-types only typechecks lib/*.js.
  types:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type tests (tsd + strict/node16 consumer)
        run: pnpm run test:types
      - name: Regenerated declarations must match the committed ones
        run: |
          pnpm run gen-types
          git diff --exit-code -- lib/sqlite3.d.ts lib/promises.d.ts lib/trace.d.ts


  # Fast test feedback via a dev rebuild instead of a full prebuild.
  # Leak check: the suite must exit on its own — nothing here passes
  # --force-exit, so a leaked handle or worker hangs the run and the
  # job times out (a failure, not a silent pass). The stray-.only guard
  # runs inside `pnpm run test` and fails rather than silently skipping.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          # Arm64 Linux was previously covered only by the slower `build`
          # matrix, which is about producing the artifact; the suite now
          # runs here on every push too.
          - ubuntu-22.04-arm
          - macos-latest
          # Added after a Windows-only path bug (a /\/test$/ strip that
          # never matches a backslash path) survived five deliverables
          # because the suite ran on Linux and macOS only — the Electron
          # job was the first thing ever to run it on Windows.
          - windows-latest
        # 24 is the engines floor and the LTS line; 26 is Current (and the
        # local dev Node). napi means one binary serves both majors, but
        # the C++ still compiles against each major's headers and the JS
        # surface still meets each major's runtime changes.
        node:
          - 24
          - 26
    name: test (${{ matrix.os }}, node=${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          scope: '@appthreat'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild native module (required after --ignore-scripts)
        run: pnpm run rebuild
      - name: Run tests
        run: pnpm run test

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-latest
        host:
          - x64
        target:
          - x64
        node:
          - 24
        include:
          - os: macos-latest
            node: 24
            host: arm64
            target: arm64
          - os: ubuntu-22.04-arm
            node: 24
            host: arm64
            target: arm64
          - os: windows-11-arm
            node: 24
            host: arm64
            target: arm64

    name: ${{ matrix.os }} (host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # Reads the version from the packageManager field in package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.host }}
          scope: '@appthreat'
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ matrix.host }}-
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.12
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        if: contains(matrix.os, 'windows')
        with:
          msbuild-architecture: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Node compatibility
        run: node tools/semver-check.js

      - name: Add env vars
        shell: bash
        run: |
          echo "V=1" >> $GITHUB_ENV

          if [ "${{ matrix.target }}" = "x86" ]; then
            echo "TARGET=ia32" >> $GITHUB_ENV
          else
            echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          fi

      - name: Add Linux env vars
        if: contains(matrix.os, 'ubuntu')
        run: |
          echo "CFLAGS=${CFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV
          echo "CXXFLAGS=${CXXFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV

      - name: Build binaries
        run: pnpm run prebuild --arch ${{ env.TARGET }} --tag-libc

      - name: Print binary info
        if: contains(matrix.os, 'ubuntu')
        run: |
          ldd prebuilds/*/*.node
          echo "---"
          nm prebuilds/*/*.node | grep "GLIBC_" | c++filt || true
          echo "---"
          file prebuilds/*/*.node

      - name: Run tests
        run: pnpm run test

      - name: Upload prebuilds to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.host }}-${{ matrix.target }}-${{ matrix.node }}
          path: prebuilds/

  build-qemu:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
        target:
          - linux/arm64
        variant:
          - alpine3.20
        include:
          # musl x64 builds
          - target: linux/amd64
            variant: alpine3.20
            node: 24
    name: ${{ matrix.variant }} (node=${{ matrix.node }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build binaries and test
        run: |
          docker buildx build \
            --file ./tools/BinaryBuilder.Dockerfile \
            --load \
            --tag sqlite-builder \
            --platform ${{ matrix.target }} \
            --no-cache \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder)
          docker cp $CONTAINER_ID:/usr/src/build/prebuilds/ ./prebuilds
      - name: Sanitize target name for Artifact
        run: |
          SAFE_TARGET=$(echo "${{ matrix.target }}" | tr '/' '-')
          echo "SAFE_TARGET=$SAFE_TARGET" >> $GITHUB_ENV
      - name: Upload QEMU prebuilds to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prebuilds-qemu-${{ matrix.variant }}-${{ env.SAFE_TARGET }}-${{ matrix.node }}
          path: prebuilds/

  # Electron (Deliverable 10). Depends on `build` and consumes its
  # prebuilds artifact — it must test the shipped binary, not a local
  # rebuild; PREBUILDS_ONLY (set inside test/electron/run.mjs) enforces
  # that even if a build/ directory were present. One pinned Electron
  # version (the devDependency), three platforms. Linux needs a display
  # for the app-environment harness and the sandbox disabled in the
  # runner container.
  electron:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: prebuilds-ubuntu-22.04-x64-x64-24
          - os: macos-latest
            artifact: prebuilds-macos-latest-arm64-arm64-24
          - os: windows-latest
            artifact: prebuilds-windows-latest-x64-x64-24
    name: electron (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies (electron's binary downloads on first launch)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the shipped prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: prebuilds/
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Suite inside Electron's Node build + app-environment harness
        if: runner.os != 'Linux'
        run: pnpm run test:electron
      - name: Suite inside Electron's Node build + app-environment harness (xvfb)
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a pnpm run test:electron

  # The packaged-ASAR cases: slow (packages Electron twice from a real
  # packed-tarball install), so ubuntu-only and not on every push —
  # post-merge on release/v9 and on demand.
  electron-asar:
    needs: build
    # Tags included: publish depends on this job, so it has to actually
    # run on the event that publishes rather than being skipped past.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (startsWith(github.ref, 'refs/heads/release/')
              || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the shipped prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prebuilds-ubuntu-22.04-x64-x64-24
          path: prebuilds/
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Packaged-ASAR tests (unpacked + sealed-in-archive)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a pnpm run test:electron:asar

  # SQLCipher source build (Deliverable 11 §2.4): the external-SQLite
  # build path must keep working, and the smoke test proves the link
  # really is SQLCipher (a wrong key must fail), not the vendored plain
  # SQLite. Like electron-asar it runs post-merge on release/ branches,
  # on tags and on demand, so a build hiccup cannot gate every push.
  #
  # SQLCipher is built from source rather than installed from apt, and
  # that is not incidental: this package uses the session extension and
  # the preupdate hook (D08), and Ubuntu's libsqlcipher-dev exports
  # neither (`nm -D libsqlcipher.so | grep sqlite3session_create` → 0),
  # so the addon cannot link against it at all. The SQLite base version
  # matters too — src/node_sqlite3.cc exports extended result codes that
  # only exist from 3.53; SQLCipher 4.18 is built on 3.53.4, the same
  # amalgamation this repo vendors, and older SQLCipher releases fail to
  # compile. All of this was reproduced in a container before it was
  # written down.
  sqlcipher:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (startsWith(github.ref, 'refs/heads/release/')
              || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SQLCIPHER_TAG: v4.18.0
      SQLITE_PREFIX: /opt/sqlcipher
      # SQLCipher's current configure installs the library as
      # libsqlite3.so with headers at <prefix>/include, NOT as
      # libsqlcipher.*/include/sqlcipher — that layout belongs to the
      # distro packaging. The libname follows the artifact, not the name.
      SQLITE_LIBNAME: sqlite3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build SQLCipher from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev tcl
          git clone --depth 1 --branch "$SQLCIPHER_TAG" \
            https://github.com/sqlcipher/sqlcipher.git /tmp/sqlcipher
          cd /tmp/sqlcipher
          # --session is required (see the job header). SQLCipher's own
          # mandatory defines have to be repeated here because setting
          # CFLAGS replaces its defaults rather than adding to them: drop
          # them and the build stops with "SQLCipher must be compiled
          # with -DSQLITE_EXTRA_INIT=…".
          CFLAGS="-DSQLITE_HAS_CODEC -DSQLITE_ENABLE_COLUMN_METADATA \
                  -DSQLITE_ENABLE_PREUPDATE_HOOK \
                  -DSQLITE_EXTRA_INIT=sqlcipher_extra_init \
                  -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown \
                  -DSQLITE_TEMP_STORE=2" \
          LDFLAGS="-lcrypto" \
            ./configure --prefix="$SQLITE_PREFIX" --session --fts5 --rtree --dbstat
          make -j"$(nproc)"
          sudo make install
          # Fail here, loudly, rather than in a confusing C++ error later.
          nm -D "$SQLITE_PREFIX/lib/lib$SQLITE_LIBNAME.so" \
            | grep -q sqlite3session_create
      - name: Build against SQLCipher
        env:
          # node-gyp 13 forwards everything after `--` to gyp as build-file
          # names, so `rebuild -- --sqlite=…` dies with "not found while
          # trying to load". The binding.gyp `sqlite` and `sqlite_libname`
          # variables are gyp defines: set them through the GYP_DEFINES
          # environment variable, which gyp reads on every run.
          GYP_DEFINES: 'sqlite=${{ env.SQLITE_PREFIX }} sqlite_libname=${{ env.SQLITE_LIBNAME }}'
          # binding.gyp adds <(sqlite)/include; Debian keeps the SQLCipher
          # headers under $SQLITE_PREFIX/include/sqlcipher, so point the
          # compiler at them too (the same CPPFLAGS dance as docs/security.md).
          CPPFLAGS: '-I${{ env.SQLITE_PREFIX }}/include'
          LDFLAGS: '-l${{ env.SQLITE_LIBNAME }} -L${{ env.SQLITE_PREFIX }}/lib'
        run: pnpm run rebuild
      - name: 'Smoke: encrypted database round trip'
        run: |
          node --input-type=module -e "
          import sqlite3 from './lib/sqlite3.js';
          const file = '/tmp/sqlcipher-smoke.db';
          const good = 'correct horse battery staple';
          const db = await sqlite3.open(file);
          await db.exec(\`PRAGMA key = '\${good}'; CREATE TABLE t (x); INSERT INTO t VALUES (42)\`);
          await db.close();
          const reopen = await sqlite3.open(file);
          await reopen.exec(\`PRAGMA key = '\${good}'\`);
          const row = await reopen.get('SELECT x FROM t');
          if (row?.x !== 42) throw new Error('encrypted round trip lost the row');
          await reopen.close();
          const wrong = await sqlite3.open(file);
          await wrong.exec(\`PRAGMA key = 'wrong key'\`);
          try {
            await wrong.get('SELECT x FROM t');
            throw new Error('wrong key read the table: this is NOT a SQLCipher build');
          } catch (err) {
            if (!/not a database|file is not a database/.test(err.message)) throw err;
          }
          await wrong.close();
          console.log('SQLCIPHER_OK');
          "

  # The Node-API promise, end to end: the binary built once under Node 24
  # by the `build` matrix must run unmodified under every supported Node.
  # This job never compiles — no rebuild step, and PREBUILDS_ONLY makes
  # node-gyp-build refuse build/Release — so green here means the shipped
  # artifact itself passed the suite, not a fresh build of it. (The `test`
  # matrix compiles from source per Node major; this one consumes.)
  prebuild-consumer:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: prebuilds-ubuntu-22.04-x64-x64-24
          - os: macos-latest
            artifact: prebuilds-macos-latest-arm64-arm64-24
          - os: windows-latest
            artifact: prebuilds-windows-latest-x64-x64-24
    name: prebuild-consumer (${{ matrix.os }}, node=26)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          scope: '@appthreat'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the shipped prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: prebuilds/
      - name: Run tests against the prebuilt binary
        env:
          PREBUILDS_ONLY: '1'
        run: pnpm run test

  # The musl half of the same promise. alpine3.20 — the variant the musl
  # prebuild is built on — has no Node 26 image (node:26-alpine tags start
  # at 3.22), so rather than moving the build floor this job *consumes*
  # the alpine3.20-built artifact inside a node:26-alpine3.22 container.
  # Same pnpm trick as tools/BinaryBuilder.Dockerfile: pnpm 11 ships
  # static musl-safe binaries. x64 only — the arm64 musl artifact is built
  # and suite-tested by build-qemu; this adds the Node-major dimension,
  # not the arch one.
  prebuild-consumer-musl:
    needs: build-qemu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # Only to resolve the exact packageManager version; the container
        # installs its own copy.
      - name: Download the shipped musl prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prebuilds-qemu-alpine3.20-linux-amd64-24
          path: prebuilds/
      - name: Suite against the musl prebuild under Node 26
        run: |
          docker run --rm -v "$PWD:/ws" -w /ws -e PREBUILDS_ONLY=1 node:26-alpine3.22 sh -c "
            npm install --global pnpm@$(pnpm --version) &&
            pnpm install --frozen-lockfile --ignore-scripts &&
            pnpm run test
          "

  publish:
    # Everything that can prove the package works gates publishing —
    # previously only [build, build-qemu] did, so a tag could publish to
    # npm with the suite, the types, the lint and every Electron job red.
    #
    # always() with an explicit failure/cancellation check, rather than a
    # bare needs list, because electron-asar does not run on every event:
    # a skipped dependency would otherwise skip publish too, including
    # the pull-request dry run. Skipped is tolerated here; failed and
    # cancelled are not.
    needs:
      - lint
      - types
      - test
      - build
      - build-qemu
      - electron
      - electron-asar
      - prebuild-consumer
      - prebuild-consumer-musl
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          scope: '@appthreat'

      - name: Download and merge all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # Reads the version from the packageManager field in package.json.

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm publish --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access=public
        if: startsWith(github.ref, 'refs/tags/')
