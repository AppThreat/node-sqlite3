name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
env:
  FORCE_COLOR: 1
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-latest
        host:
          - x64
        target:
          - x64
        node:
          - 20
        include:
          - os: macos-latest
            node: 24
            host: arm64
            target: arm64
          - os: ubuntu-22.04-arm
            node: 24
            host: arm64
            target: arm64
          - os: windows-11-arm
            node: 24
            host: arm64
            target: arm64

    name: ${{ matrix.os }} (host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.host }}
          scope: '@appthreat'
      - name: Add yarn
        run: npm install -g yarn
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.12
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        if: contains(matrix.os, 'windows')
        with:
          msbuild-architecture: ${{ matrix.target }}
      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Check Node compatibility
        run: node tools/semver-check.js

      - name: Add env vars
        shell: bash
        run: |
          echo "V=1" >> $GITHUB_ENV

          if [ "${{ matrix.target }}" = "x86" ]; then
            echo "TARGET=ia32" >> $GITHUB_ENV
          else
            echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          fi

      - name: Add Linux env vars
        if: contains(matrix.os, 'ubuntu')
        run: |
          echo "CFLAGS=${CFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV
          echo "CXXFLAGS=${CXXFLAGS:-} -include ../src/gcc-preinclude.h" >> $GITHUB_ENV

      - name: Build binaries
        run: yarn prebuild --arch ${{ env.TARGET }} --tag-libc

      - name: Print binary info
        if: contains(matrix.os, 'ubuntu')
        run: |
          ldd prebuilds/*/*.node
          echo "---"
          nm prebuilds/*/*.node | grep "GLIBC_" | c++filt || true
          echo "---"
          file prebuilds/*/*.node

      - name: Run tests
        run: yarn test

      - name: Upload prebuilds to artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.host }}-${{ matrix.target }}-${{ matrix.node }}
          path: prebuilds/
          retention-days: 7

  build-qemu:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
        target:
          - linux/arm64
        variant:
          - alpine3.20
        include:
          # musl x64 builds
          - target: linux/amd64
            variant: alpine3.20
            node: 24
    name: ${{ matrix.variant }} (node=${{ matrix.node }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build binaries and test
        run: |
          docker buildx build \
            --file ./tools/BinaryBuilder.Dockerfile \
            --load \
            --tag sqlite-builder \
            --platform ${{ matrix.target }} \
            --no-cache \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder)
          docker cp $CONTAINER_ID:/usr/src/build/prebuilds/ ./prebuilds
      - name: Sanitize target name for Artifact
        run: |
          SAFE_TARGET=$(echo "${{ matrix.target }}" | tr '/' '-')
          echo "SAFE_TARGET=$SAFE_TARGET" >> $GITHUB_ENV
      - name: Upload QEMU prebuilds to artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: prebuilds-qemu-${{ matrix.variant }}-${{ env.SAFE_TARGET }}-${{ matrix.node }}
          path: prebuilds/
          retention-days: 7

  publish:
    needs: [build, build-qemu]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          scope: '@appthreat'

      - name: Download and merge all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true

      - name: Add yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: |
          yarn install --ignore-scripts
          npm publish --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access=public
        if: startsWith(github.ref, 'refs/tags/')
